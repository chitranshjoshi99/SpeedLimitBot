name: Release

# Publishing a GitHub release builds the signed APK and AAB and attaches them to it.
# The keystore never lives in the repo: CI rebuilds ~/.speedlimitbot/keystore.properties,
# the same path a local release build reads, from repository secrets.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, e.g. v1.0.2
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # The in-app update check compares the release tag against the installed versionName,
      # so a tag that disagrees with the build would offer an update that installs the same
      # version forever. Fail here instead.
      - name: Tag must match versionName
        run: |
          DECLARED=$(grep -m1 -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          if [ "$DECLARED" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match versionName $DECLARED in app/build.gradle.kts"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Unpin the local JDK path
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. An unsigned APK cannot be installed, and a"
            echo "::error::build signed with a different key cannot update an existing install."
            exit 1
          fi
          mkdir -p ~/.speedlimitbot
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.speedlimitbot/release.jks
          cat > ~/.speedlimitbot/keystore.properties <<EOF
          storeFile=$HOME/.speedlimitbot/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: ./gradlew --no-daemon :app:test :app:assembleRelease :app:bundleRelease

      # Prints the certificate SHA-256, which is the fingerprint the README documents.
      - name: Verify the APK is signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "SpeedLimitBot-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "SpeedLimitBot-$VERSION.aab"
          gh release upload "$TAG" \
            "SpeedLimitBot-$VERSION.apk#SpeedLimitBot-$VERSION.apk (phone install)" \
            "SpeedLimitBot-$VERSION.aab#SpeedLimitBot-$VERSION.aab (upload to Play for car support)" \
            --clobber
